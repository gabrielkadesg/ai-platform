version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_platform_db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ai_platform}
      POSTGRES_USER: ${DATABASE_USER:-ai_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ai_password}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ai_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_platform_network

volumes:
  postgres_data:

networks:
  ai_platform_network:
    driver: bridge
